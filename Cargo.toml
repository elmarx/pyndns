[package]
name = "dyndns"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1", features = ["full"] }
warp = "0.3"
serde = { version = "1.0.126", features = ["derive"] }
serde_json = "1.0.64"
http = "0.2.4"
base64 = "0.13.0"
pretty_env_logger = "0.4.0"
ipnet = "2.3.0"
lazy_static = "1.4.0"
