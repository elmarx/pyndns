#!/usr/bin/env ansible-playbook
- hosts: localhost
  tasks:
    - name: compile the binary
      command: cross build --target x86_64-unknown-linux-gnu --release

- hosts: ns.eathmer.de
  tasks:
    - name: setup the host
      tags: never
      block:
        - name: create group for daemon user
          group:
            name: dyndns
            system: yes

        - name: create a user for the daemon
          user:
            name: dyndns
            group: dyndns
            groups: pdns

        - name: allow the dyndns user to reload powerdns zonse
          copy:
            validate: /usr/sbin/visudo -csf %s
            dest: /etc/sudoers.d/dyndns
            content: >
              %dyndns ALL=(ALL) NOPASSWD: /usr/bin/pdns_control reload

    - name: upload the binary
      copy:
        src: target/x86_64-unknown-linux-gnu/release/dyndns
        dest: /usr/local/bin
        mode: "0755"
      notify: restart dyndns

    - name: install the systemd unit file
      template:
        src: ./dyndns.service.j2
        dest: /etc/systemd/system/dyndns.service
      notify: restart dyndns

  handlers:
    - name: restart dyndns
      systemd:
        state: restarted
        enabled: yes
        daemon_reload: yes
        name: dyndns